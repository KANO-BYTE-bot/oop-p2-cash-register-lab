<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cash register project screenshot">
  <rect width="960" height="540" fill="#0f172a" />
  <rect x="40" y="40" width="880" height="460" rx="28" fill="#111827" stroke="#38bdf8" stroke-width="4" />
  <text x="90" y="120" fill="#e5eefb" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Cash Register Lab</text>
  <text x="90" y="180" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="26">Add items • Apply discounts • Void transactions</text>
  <rect x="90" y="225" width="260" height="160" rx="18" fill="#1f2937" stroke="#60a5fa" stroke-width="3" />
  <text x="120" y="275" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Example</text>
  <text x="120" y="320" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="18">register.add_item("eggs", 0.98)</text>
  <text x="120" y="355" fill="#bfdbfe" font-family="Arial, Helvetica, sans-serif" font-size="18">register.apply_discount()</text>
  <rect x="390" y="225" width="480" height="160" rx="18" fill="#052e16" stroke="#4ade80" stroke-width="3" />
  <text x="420" y="275" fill="#ecfdf5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Output</text>
