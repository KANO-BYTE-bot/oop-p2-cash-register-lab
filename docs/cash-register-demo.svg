  <text x="420" y="355" fill="#bbf7d0" font-family="Arial, Helvetica, sans-serif" font-size="18">Total: $800.00</text>
  <text x="90" y="430" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="18">Python object-oriented project with tests and README documentation.</text>
